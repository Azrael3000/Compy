<head>
    <title>Compy {{version}}</title>
    <link rel="icon" href="{{ url_for('static', filename='compy.svg') }}" type="image/svg+xml">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background-image: linear-gradient(#005B96, #002F6C);
            color: #F0F8FF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        h1 { font-size: 20px; font-weight: 600; opacity: 0.7; margin: 0 0 24px 0; }
        h2 { font-size: 28px; margin: 0 0 24px 0; }
        input[type=password] {
            font-size: 16px;
            padding: 8px 12px;
            border: none;
            border-radius: 6px 0 0 6px;
            outline: none;
        }
        button {
            font-size: 16px;
            padding: 8px 16px;
            border: none;
            border-radius: 0 6px 6px 0;
            background: #AEECEF;
            color: #002F6C;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #F0F8FF; }
        .error { color: #FFB4A2; margin: 16px 0 0 0; }
    </style>
</head>

<body>
    <div>
        <h1>Compy {{version}}</h1>
        <h2>Admin login</h2>
        <form method="post" action="{{ url_for('login') }}">
            <input type="password" id="admin_password" name="password" placeholder="Admin password" autofocus autocomplete="current-password"/><button id="admin_login_button" type="submit">Log in</button>
        </form>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
    </div>
</body>
</html>
